# 云端构建 EasyWebUI DMG（替代本地打包）
#
# 触发方式:
#   1. 手动: Actions 页 → Build DMG → Run workflow（可填版本号）
#   2. 打 tag: git tag v1.0.3 && git push origin v1.0.3
#      → 自动构建并创建 GitHub Release，DMG 作为附件
#
# 产物: dist/EasyWebUI-<版本>.dmg（artifact / Release 附件）
# 说明: ad-hoc 签名（与本地一致），用户首次打开仍需右键→打开
name: build-dmg

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'DMG 版本号（留空则取工程 MARKETING_VERSION）'
        required: false
        default: ''
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    # macOS 26 (Tahoe) arm64 镜像；工程部署目标 26.5，需挑选最新 Xcode（SDK 足够新）
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          ls -d /Applications/Xcode*.app 2>/dev/null || true
          latest="$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)"
          echo "Using: $latest"
          sudo xcode-select -s "$latest/Contents/Developer"
          xcodebuild -version

      - name: Run unit tests
        run: |
          xcodebuild test -project easy-webui.xcodeproj -scheme easy-webui \
            -destination 'platform=macOS' -derivedDataPath .build-ci-test

      - name: Build & package DMG
        run: |
          if [[ -n "${{ github.event.inputs.version }}" ]]; then
            VER="${{ github.event.inputs.version }}"
          elif [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            VER="${GITHUB_REF_NAME#v}"
          else
            VER=""
          fi
          ./scripts/build_dmg.sh "$VER"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: EasyWebUI-dmg
          path: dist/*.dmg
          if-no-files-found: error

      - name: Create GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.dmg
          name: EasyWebUI ${{ github.ref_name }}
          body: |
            EasyWebUI ${{ github.ref_name }}

            构建产物: `dist/EasyWebUI-${{ github.ref_name }}.dmg`
            （ad-hoc 签名，未公证；首次打开需右键 → 打开）
